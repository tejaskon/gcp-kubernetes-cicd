apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
      - name: backend-api
        image: us-central1-docker.pkg.dev/sre-project-506813/lab-repo/backend-api:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: app
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: backend-api