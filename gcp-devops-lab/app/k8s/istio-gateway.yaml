apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: lab-gateway
  namespace: app
spec:
  selector:
    istio: ingressgateway # uses default Istio ingress gateway controller
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: frontend-vs
  namespace: app
spec:
  hosts:
  - "*"
  gateways:
  - lab-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: frontend
        port:
          number: 80