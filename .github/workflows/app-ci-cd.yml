name: 'App Build & Deploy'
on:
  push:
    paths: ['app/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
    - uses: actions/checkout@v4
    
    # 1. Authenticate to Google Cloud via Workload Identity Federation
    - uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/95162175090/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-actions-sa@sre-project-506813.iam.gserviceaccount.com'
    
    # 2. Setup gcloud CLI (configures gcloud to use the authenticated session)
    - uses: google-github-actions/setup-gcloud@v2

    # 3. Authenticate Docker directly using the active gcloud token session
    - name: Login to Artifact Registry
      run: gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin us-central1-docker.pkg.dev

    # 4. Build and Push Microservices
    - name: Build and Push Microservices
      run: |
        docker build -t us-central1-docker.pkg.dev/sre-project-506813/gcp-kubernetes-cicd/backend-api:latest ./app/backend-api
        docker push us-central1-docker.pkg.dev/sre-project-506813/gcp-kubernetes-cicd/backend-api:latest
        
        docker build -t us-central1-docker.pkg.dev/sre-project-506813/gcp-kubernetes-cicd/users-service:latest ./app/users-service
        docker push us-central1-docker.pkg.dev/sre-project-506813/gcp-kubernetes-cicd/users-service:latest
        
        docker build -t us-central1-docker.pkg.dev/sre-project-506813/gcp-kubernetes-cicd/frontend:latest ./app/frontend
        docker push us-central1-docker.pkg.dev/sre-project-506813/gcp-kubernetes-cicd/frontend:latest

    # 5. Fetch GKE Credentials
    - uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: 'lab-gke-cluster'
        location: 'us-central1'

    # 6. Apply Kubernetes Manifests
    - name: Apply Kubernetes Manifests
      run: |
        kubectl apply -f app/k8s/namespace.yaml
        kubectl apply -f app/k8s/postgres-pv.yaml
        kubectl apply -f app/k8s/backend-deployment.yaml
        kubectl apply -f app/k8s/users-deployment.yaml
        kubectl apply -f app/k8s/frontend-deployment.yaml