apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
      - name: users-service
        image: us-central1-docker.pkg.dev/sre-project-506813/lab-repo/users-service:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: app
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: users-service